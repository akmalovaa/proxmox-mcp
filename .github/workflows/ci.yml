name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # --locked fails if uv.lock is stale against pyproject.toml, which is what
      # broke tag 1.0.5. Better to catch it on the PR than during a release.
      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only, no push: a broken Dockerfile should fail here rather than
      # halfway through a tagged release.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: proxmox-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image over stdio
        run: |
          python3 - <<'PY'
          import json, subprocess

          proc = subprocess.Popen(
              ["docker", "run", "-i", "--rm",
               "-e", "PROXMOX_HOST=192.0.2.1",
               "-e", "PROXMOX_TOKEN_NAME=t",
               "-e", "PROXMOX_TOKEN_VALUE=v",
               "-e", "PROXMOX_RISK_LEVEL=all",
               "proxmox-mcp:ci"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
          )

          def send(msg):
              proc.stdin.write(json.dumps(msg) + "\n")
              proc.stdin.flush()

          send({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                           "clientInfo": {"name": "ci", "version": "1"}}})
          init = json.loads(proc.stdout.readline())["result"]
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})
          tools = json.loads(proc.stdout.readline())["result"]["tools"]
          proc.stdin.close()
          proc.wait(timeout=30)

          print(f"server {init['serverInfo']['name']} {init['serverInfo']['version']}")
          print(f"tools listed: {len(tools)}")
          # The image must serve its tool list with no reachable Proxmox behind it.
          # Exact counts per tier are asserted in tests/test_registration.py.
          assert init["serverInfo"]["version"], "version metadata missing from the image"
          assert {"list_nodes", "start_vm", "rollback_vm_snapshot"} <= {t["name"] for t in tools}
          PY

      - name: Smoke-test the image over streamable-http
        run: |
          docker run -d --name mcp-http -p 8000:8000 \
            -e PROXMOX_HOST=192.0.2.1 \
            -e PROXMOX_TOKEN_NAME=t \
            -e PROXMOX_TOKEN_VALUE=v \
            -e PROXMOX_RISK_LEVEL=all \
            -e PROXMOX_MCP_TRANSPORT=streamable-http \
            -e PROXMOX_MCP_HOST=0.0.0.0 \
            -e PROXMOX_MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:* \
            proxmox-mcp:ci
          for _ in $(seq 30); do
            curl -fs http://127.0.0.1:8000/healthz && break || sleep 1
          done
          python3 - <<'PY'
          import json, urllib.error, urllib.request

          BASE = "http://127.0.0.1:8000"
          ENVELOPE = {
              "io.modelcontextprotocol/protocolVersion": "2026-07-28",
              "io.modelcontextprotocol/clientCapabilities": {},
          }

          def post(headers, path="/mcp"):
              body = json.dumps(
                  {"jsonrpc": "2.0", "id": 1, "method": "tools/list",
                   "params": {"_meta": ENVELOPE}}
              ).encode()
              request = urllib.request.Request(BASE + path, data=body, headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "MCP-Protocol-Version": "2026-07-28",
                  "Mcp-Method": "tools/list",
                  **headers,
              })
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, None

          # Liveness must answer without a reachable Proxmox behind it; readiness
          # must not, since 192.0.2.1 is the unroutable TEST-NET address.
          with urllib.request.urlopen(BASE + "/healthz") as response:
              assert json.load(response)["status"] == "ok"
          try:
              urllib.request.urlopen(BASE + "/readyz")
              raise AssertionError("/readyz answered 200 with no Proxmox reachable")
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, exc.code

          status, payload = post({})
          result = payload["result"]
          print(f"tools listed over http: {len(result['tools'])}")
          assert status == 200
          assert {"list_nodes", "start_vm", "get_server_info"} <= {
              t["name"] for t in result["tools"]
          }
          # cache_hints, so a client is not forced to re-fetch a list that cannot change
          assert result["ttlMs"] > 0, result.get("ttlMs")
          assert result["cacheScope"] == "public"

          # DNS-rebinding protection: the SDK ships it off, so this is the test that
          # catches it silently turning back off.
          assert post({"Origin": "http://evil.example"})[0] == 403
          assert post({"Host": "evil.example"})[0] == 421
          PY

      - name: Container logs
        if: always()
        run: docker logs mcp-http || true
