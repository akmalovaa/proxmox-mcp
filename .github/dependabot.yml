version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Keeps the pinned uv and python base images in the Dockerfile moving.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
